<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Première Page Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1em;
    }
    nav {
      background-color: #555;
      padding: 0.5em;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
    }
    main {
      padding: 2em;
    }
    section {
      margin-bottom: 2em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenue sur ma page</h1>
  </header>

  <nav>
    <a href="#section1">Accueil</a>
    <a href="#section2">À propos</a>
    <a href="#section3">Contact</a>
  </nav>

  <main>
    <section id="section1">
      <h2>Accueil</h2>
      <p>Voici la section d’accueil avec un peu de texte pour vous souhaiter la bienvenue.</p>
    </section>

    <section id="section2">
      <h2>À propos</h2>
      <p>Ce site a été créé pour démontrer une structure HTML de base.</p>
    </section>

    <section id="section3">
      <h2>Contact</h2>
      <p>Écrivez-nous à <a href="mailto:info@example.com">info@example.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 - Mon site web</p>
  </footer>

</body>
</html>
